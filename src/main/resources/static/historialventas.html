<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boticaestrella | Historial de Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <!-- FASE 1: Rutas estáticas directas al sistema de archivos del frontend -->
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="header-tech">
            <div class="header-title">
                <h2 class="text-white">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--brand-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Auditoría e Historial de Ventas
                </h2>
            </div>
            <!-- FASE 1: Redirección directa a la vista de punto de venta en HTML -->
            <a href="Venta.html" class="btn-tech">Volver al Punto de Venta</a>
        </div>

        <div class="search-box-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" width="20" height="20">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="buscadorVentas" placeholder="Buscar por Cliente, S/N, Comprobante..." class="input-tech">
        </div>

        <div class="table-panel">
            <table class="tech-table" id="tablaVentas">
                <thead>
                    <tr>
                        <th>FECHA / HORA</th>
                        <th>N° COMPROBANTE</th>
                        <th>CLIENTE</th>
                        <th>Producto (S/N)</th>
                        <th>TOTAL</th>
                        <th class="text-center">ESTADO</th>
                        <th class="text-center">ACCIÓN</th>
                    </tr>
                </thead>
                <!-- FASE 4: Contenedor de datos vacío para inyección dinámica de tr/td con JavaScript -->
                <tbody id="tbodyHistorialVentas">
                    <tr>
                        <td colspan="7" class="text-center p-30 text-muted">
                            Cargando auditoría de transacciones...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Carga modular de las capas de comunicación, utilidades y lógica visual -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/historialventas.js"></script>
</body>
</html>
